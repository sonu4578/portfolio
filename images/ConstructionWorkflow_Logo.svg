<svg xmlns="http://www.w3.org/2000/svg" width="502" height="208" viewBox="0 0 502 208">
  <!-- Background -->
  <rect width="502" height="208" fill="#f0f4f8"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="208" fill="#E67E22"/>

  <!-- Icon group, centered in left ~180px zone -->
  <g transform="translate(30, 20)">

    <!-- Foundation slab -->
    <rect x="20" y="140" width="90" height="12" rx="2" fill="#2c6fad"/>

    <!-- Mast -->
    <rect x="68" y="14" width="10" height="128" fill="#2c6fad" stroke="#1a4f8a" stroke-width="1"/>

    <!-- Operator cab -->
    <rect x="65" y="6" width="16" height="12" rx="2" fill="#1a4f8a"/>

    <!-- Jib (long working arm) -->
    <rect x="16" y="10" width="60" height="8" rx="2" fill="#4A90D9"/>

    <!-- Counter-jib + counterweight -->
    <rect x="78" y="10" width="28" height="8" rx="2" fill="#4A90D9"/>
    <rect x="96" y="18" width="12" height="10" rx="1" fill="#6aaee8"/>

    <!-- Hook cable + hook -->
    <line x1="28" y1="18" x2="28" y2="62" stroke="#2c6fad" stroke-width="3" stroke-linecap="round"/>
    <rect x="23" y="62" width="10" height="8" rx="2" fill="#2c6fad"/>

  </g>

  <!-- Divider line -->
  <line x1="178" y1="30" x2="178" y2="178" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Text -->
  <text x="198" y="76" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#2c3e50">Construction Workflow</text>
  <text x="198" y="106" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#2c3e50">Platform</text>
  <text x="198" y="138" font-family="Poppins, Arial, sans-serif" font-weight="400" font-size="18" fill="#4A90D9">Real-time field tracking</text>
</svg>
